    <div class="trivia-explain-body" id="triviaExplainBody"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const cfg = JSON.parse(document.getElementById('party-config').textContent);
  const PARTY_YEAR = cfg.year || '2026';
  const FIREBASE_CONFIG = cfg.firebaseConfig;
  const DATA = window.EUROVISION_DATA || {};
  const SHOW_NAMES = window.EUROVISION_SHOW_NAMES || {};
  const DEFAULT_STAGE = DATA.show || 'grand-final';
  const KEY_STAGE = 'ev_' + PARTY_YEAR + '_stage';
  let STAGE = localStorage.getItem(KEY_STAGE);
  if (!STAGE || !SHOW_NAMES[STAGE]) STAGE = DEFAULT_STAGE;
  const showList = (DATA.shows && DATA.shows[STAGE]) || [];
  const stageConfigured = Array.isArray(showList) && showList.length > 0;
  const showName = SHOW_NAMES[STAGE] || 'Grand Final';
  const _origDataShow = DATA.show;
  DATA.show = STAGE;
  const acts = stageConfigured && typeof window.eurovisionResolveActs === 'function'
    ? window.eurovisionResolveActs()
    : [];
  DATA.show = _origDataShow;
  const actsByCode = {};
  acts.forEach(a => { actsByCode[a.code] = a; });
  const _showEl = document.getElementById('showName');
  if (_showEl) _showEl.textContent = showName;

  const KEY_PARTY = 'ev_' + PARTY_YEAR + '_party';
  const Humor = window.EurovisionHumor || { scoreComment: () => 0, DISPLAY_THRESHOLD: 4 };
  const SCORE_FIELDS = ['vocals', 'performance', 'song', 'original', 'stage'];
  const MIN_VOTES_FOR_AVG = 3;

  const $ = id => document.getElementById(id);

  const partyCode = (
    new URLSearchParams(window.location.search).get('party') ||
    localStorage.getItem(KEY_PARTY) ||
    ''
  ).toUpperCase().slice(0, 8);

  const _helpBtn = document.getElementById('helpBtn');
  if (_helpBtn && partyCode) _helpBtn.href = 'help.html?party=' + encodeURIComponent(partyCode);

  if (!partyCode) {
    console.warn('No party selected.');
    $('triviaHost').style.display = 'none';
    return;
  }

  if (!stageConfigured) {
    $('triviaHost').style.display = 'none';
    const stageEmpty = $('stageEmpty');
    if (stageEmpty) stageEmpty.style.display = '';
    return;
  }

  let partyUsers = {};

  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  db.ref(PARTY_YEAR + '/parties/' + partyCode + '/users').on('value', snap => {
    partyUsers = snap.val() || {};
    renderTrivia();
  }, err => {
    console.warn('Firebase read failed:', err);
  });

  function extractStageVotes(votesNode) {
    if (!votesNode || typeof votesNode !== 'object') return {};
    if (votesNode[STAGE] && typeof votesNode[STAGE] === 'object') return votesNode[STAGE];
    if (STAGE === 'semi-1') {
      const flat = {};
      Object.entries(votesNode).forEach(([k, v]) => {
        if (v && typeof v === 'object' && typeof v.vocals === 'number') flat[k] = v;
      });
      return flat;
    }
    return {};
  }

  function buildUserAggregates() {
    return Object.entries(partyUsers).map(([uid, data]) => {
      const name = (((data && data.name) || 'Guest') + '').trim() || 'Guest';
      const votes = extractStageVotes(data && data.votes);
      const voteList = Object.entries(votes).filter(([, v]) => v && typeof v.total === 'number');
      const totals = voteList.map(([, v]) => v.total);
      const avg = totals.length ? totals.reduce((a, b) => a + b, 0) / totals.length : null;
      const comments = voteList
        .map(([code, v]) => ({ code, text: (v && typeof v.remind === 'string' ? v.remind.trim() : '') }))
        .filter(c => c.text.length > 0);
      const totalCommentChars = comments.reduce((sum, c) => sum + c.text.length, 0);
      return { uid, name, votes, voteList, totals, avg, comments, totalCommentChars };
    }).sort((a, b) => a.name.localeCompare(b.name) || a.uid.localeCompare(b.uid));
  }

  function pickExtreme(users, metricFn, direction, eligibleFn) {
    let best = null;
    users.forEach(u => {
      if (eligibleFn && !eligibleFn(u)) return;
      const value = metricFn(u);
      if (value === null || value === undefined) return;
      if (
        !best ||
        (direction === 'max' && value > best.value) ||
        (direction === 'min' && value < best.value)
      ) {
        best = { user: u, value };
      }
    });
    return best;
  }

  function biggestHater(users) {
    return pickExtreme(users, u => u.avg, 'min', u => u.totals.length >= MIN_VOTES_FOR_AVG);
  }

  function biggestLover(users) {
    return pickExtreme(users, u => u.avg, 'max', u => u.totals.length >= MIN_VOTES_FOR_AVG);
  }

  function mostVerboseComment(users) {
    let best = null;
    users.forEach(u => {
      u.comments.forEach(c => {
        if (
          !best ||
          c.text.length > best.value ||
          (c.text.length === best.value && u.name.localeCompare(best.user.name) < 0)
        ) {
          best = { user: u, value: c.text.length, detail: c };
        }
      });
    });
    return best;
  }

  function mostVerboseOverall(users) {
    return pickExtreme(users, u => u.totalCommentChars, 'max', u => u.totalCommentChars > 0);
  }

  function wittiest(users) {
    let best = null;
    users.forEach(u => {
      u.comments.forEach(c => {
        const score = Humor.scoreComment(c.text);
        if (score < (Humor.DISPLAY_THRESHOLD || 4)) return;
        if (
          !best ||
          score > best.value ||
          (score === best.value && c.text.length > best.detail.text.length) ||
          (score === best.value && c.text.length === best.detail.text.length && u.name.localeCompare(best.user.name) < 0)
        ) {
          best = { user: u, value: score, detail: c };
        }
      });
    });
    return best;
  }

  function mostIncomplete(users) {
    const total = acts.length;
    if (total === 0) return null;
    return pickExtreme(
      users,
      u => total - u.totals.length,
      'max',
      u => u.totals.length >= 1 && (total - u.totals.length) > 0
    );
  }

  function mostContrarian(users) {
    if (users.length < 2) return null;
    const actTotals = {};
    users.forEach(u => {
      Object.entries(u.votes).forEach(([code, v]) => {
        if (typeof v.total !== 'number') return;
        if (!actTotals[code]) actTotals[code] = [];
        actTotals[code].push(v.total);
      });
    });
    const partyAvg = {};
    Object.entries(actTotals).forEach(([code, arr]) => {
      partyAvg[code] = arr.reduce((a, b) => a + b, 0) / arr.length;
    });
    return pickExtreme(
      users,
      u => {
        const diffs = Object.entries(u.votes)
          .filter(([code, v]) => typeof v.total === 'number' && typeof partyAvg[code] === 'number' && actTotals[code].length >= 2)
          .map(([code, v]) => Math.abs(v.total - partyAvg[code]));
        return diffs.length >= MIN_VOTES_FOR_AVG ? diffs.reduce((a, b) => a + b, 0) / diffs.length : null;
      },
      'max',
      u => u.totals.length >= MIN_VOTES_FOR_AVG
    );
  }

  function underdogChampion(users) {
    if (users.length < 2) return null;
    const actTotals = {};
    users.forEach(u => {
      Object.entries(u.votes).forEach(([code, v]) => {
        if (typeof v.total !== 'number') return;
        if (!actTotals[code]) actTotals[code] = [];
        actTotals[code].push(v.total);
      });
    });
    let lowestCode = null, lowestAvg = Infinity;
    Object.entries(actTotals).forEach(([code, arr]) => {
      if (arr.length < 2) return;
      const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
      if (avg < lowestAvg) { lowestAvg = avg; lowestCode = code; }
    });
    if (!lowestCode) return null;
    let best = null;
    users.forEach(u => {
      const v = u.votes[lowestCode];
      if (!v || typeof v.total !== 'number') return;
      if (!best || v.total > best.value || (v.total === best.value && u.name.localeCompare(best.user.name) < 0)) {
        best = { user: u, value: v.total, detail: { code: lowestCode, partyAvg: lowestAvg } };
      }
    });
    return best;
  }

  function mostConsistentVoter(users) {
    return pickExtreme(
      users,
      u => {
        if (u.totals.length < MIN_VOTES_FOR_AVG) return null;
        const mean = u.totals.reduce((a, b) => a + b, 0) / u.totals.length;
        const variance = u.totals.reduce((s, t) => s + Math.pow(t - mean, 2), 0) / u.totals.length;
        return Math.sqrt(variance);
      },
      'min',
      u => u.totals.length >= MIN_VOTES_FOR_AVG
    );
  }

  function actLabel(code) {
    const act = actsByCode[code];
    if (!act) return '';
    return act.flag + ' ' + act.country + ' · ' + act.performer + ' · “' + act.song + '”';
  }

  function buildCard(title, result, valueFormatter, detailRenderer, sideDetailFormatter, explain) {
    if (!result) return null;
    const card = document.createElement('div');
    card.className = 'trivia-card stat';

    // Header row: title left, voter name right
    const header = document.createElement('div');
    header.className = 'tc-header';
    const titleEl = document.createElement('div');
    titleEl.className = 'tc-title stat-label';
    titleEl.textContent = title;
    const voterEl = document.createElement('div');
    voterEl.className = 'tc-voter';
    voterEl.textContent = result.user.name;
    header.appendChild(titleEl);
    header.appendChild(voterEl);
    card.appendChild(header);

    // Body row: value left, optional side detail right
    const body = document.createElement('div');
    body.className = 'tc-body';
    const valueEl = document.createElement('div');
    valueEl.className = 'tc-value';
    valueEl.textContent = valueFormatter(result);
    body.appendChild(valueEl);
    if (sideDetailFormatter) {
      const sideEl = document.createElement('div');
      sideEl.className = 'tc-side';
      sideEl.textContent = sideDetailFormatter(result);
      body.appendChild(sideEl);
    }
    card.appendChild(body);

    // Block detail below (quotes, act labels, etc.)
    if (detailRenderer) {
      const detail = detailRenderer(result);
      if (detail) {
        detail.classList.add('tc-detail');
        card.appendChild(detail);
      }
    }

    // Explanation on tap
    if (explain) {
      card.dataset.explain = explain;
      card.dataset.explainTitle = title;
      card.addEventListener('click', showExplain);
    }

    return card;
  }

  function showExplain(e) {
    const card = e.currentTarget;
    const backdrop = $('triviaExplainBackdrop');
    $('triviaExplainTitle').textContent = card.dataset.explainTitle || '';
    $('triviaExplainBody').textContent = card.dataset.explain || '';
    backdrop.style.display = '';
    backdrop.removeAttribute('aria-hidden');
  }

  function hideExplain() {
    const backdrop = $('triviaExplainBackdrop');
    backdrop.style.display = 'none';
    backdrop.setAttribute('aria-hidden', 'true');
  }

  $('triviaExplainBackdrop').addEventListener('click', function (e) {
    if (e.target === this) hideExplain();
  });

  function renderTrivia() {
    const users = buildUserAggregates();
    const grid = $('triviaGrid');
    const emptyMsg = $('triviaEmpty');
    grid.replaceChildren();

    const anyVotes = users.some(u => u.totals.length > 0);
    if (!anyVotes) {
      emptyMsg.style.display = '';
      return;
    }
    emptyMsg.style.display = 'none';

    const cards = [
      buildCard('Biggest Hater', biggestHater(users),
        r => r.value.toFixed(1) + ' avg',
        null,
        r => r.user.totals.length + ' rated',
        'Gave the lowest average score across all their rated acts. Nobody else was quite so unimpressed.'),
      buildCard('Biggest Lover', biggestLover(users),
        r => r.value.toFixed(1) + ' avg',
        null,
        r => r.user.totals.length + ' rated',
        'Gave the highest average score across all their rated acts. The eternal optimist of the party.'),
      buildCard('Most Verbose Comment', mostVerboseComment(users),
        r => r.value + ' chars',
        r => {
          const wrap = document.createElement('div');
          const q = document.createElement('div');
          q.className = 'tc-quote';
          q.textContent = '”' + r.detail.text + '”';
          wrap.appendChild(q);
          const lbl = actLabel(r.detail.code);
          if (lbl) {
            const a = document.createElement('div');
            a.className = 'tc-act';
            a.textContent = lbl;
            wrap.appendChild(a);
          }
          return wrap;
        },
        null,
        'Left the single longest note on any one act. Clearly had a lot to say.'),
      buildCard('Most Verbose Overall', mostVerboseOverall(users),
        r => r.value + ' chars',
        null,
        r => 'across ' + r.user.comments.length + ' comment' + (r.user.comments.length === 1 ? '' : 's'),
        'Wrote the most total characters of notes across all their votes combined.'),
      buildCard('Wittiest', wittiest(users),
        r => 'humor score ' + r.value,
        r => {
          const wrap = document.createElement('div');
          const q = document.createElement('div');
          q.className = 'tc-quote';
          q.textContent = '”' + r.detail.text + '”';
          wrap.appendChild(q);
          const lbl = actLabel(r.detail.code);
          if (lbl) {
            const a = document.createElement('div');
            a.className = 'tc-act';
            a.textContent = lbl;
            wrap.appendChild(a);
          }
          return wrap;
        },
        null,
        'Had the funniest comment on any act, as scored by the built-in humor scorer. Emoji, sarcasm, and Eurovision jargon all count.'),
      buildCard('Most Incomplete', mostIncomplete(users),
        r => r.value + ' missing',
        null,
        r => r.user.totals.length + ' of ' + acts.length + ' rated',
        'Started voting but skipped the most acts. Still on the fence about those ones.'),
      buildCard('Most Contrarian', mostContrarian(users),
        r => r.value.toFixed(1) + ' avg deviation',
        null,
        r => r.user.totals.length + ' rated',
        'Whose scores deviated most from the rest of the party on average. A lone voice in the room.'),
      buildCard('Underdog Champion', underdogChampion(users),
        r => r.value + ' / 25',
        r => {
          const lbl = actLabel(r.detail.code);
          if (!lbl) return null;
          const a = document.createElement('div');
          a.className = 'tc-act';
          a.textContent = lbl;
          return a;
        },
        r => 'party avg ' + r.detail.partyAvg.toFixed(1),
        'Gave the highest score to the act the rest of the party liked least. Champion of lost causes.'),
      buildCard('Most Consistent', mostConsistentVoter(users),
        r => r.value.toFixed(1) + ' standard deviation',
        null,
        r => r.user.totals.length + ' rated',
        'Had the lowest spread in their scores — rated everything similarly with no big peaks or troughs.'),
    ].filter(Boolean);

    cards.forEach(c => grid.appendChild(c));

    if (cards.length === 0) {
      emptyMsg.textContent = 'Not enough votes yet to award superlatives.';
      emptyMsg.style.display = '';
    }
  }
})();
</script>
