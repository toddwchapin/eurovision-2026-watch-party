        <path d="M32 48 C15 36 15 24 22 20 C27 17 31 21 32 24 C33 21 37 17 42 20 C49 24 49 36 32 48 Z"/>
        <path d="M32 44 C18 34 19 26 24 22 C28 19 31 23 32 26 C33 23 36 19 40 22 C45 26 46 34 32 44 Z"/>

<script>
(function () {
  'use strict';

  const cfg = JSON.parse(document.getElementById('party-config').textContent);
  const PARTY_YEAR = cfg.year || '2026';
  const FIREBASE_CONFIG = cfg.firebaseConfig;
  const DATA = window.EUROVISION_DATA || {};
  const SHOW_NAMES = window.EUROVISION_SHOW_NAMES || {};
  const DEFAULT_STAGE = DATA.show || 'grand-final';
  const KEY_STAGE = 'ev_' + PARTY_YEAR + '_stage';
  let STAGE = localStorage.getItem(KEY_STAGE);
  if (!STAGE || !SHOW_NAMES[STAGE]) STAGE = DEFAULT_STAGE;
  const showList = (DATA.shows && DATA.shows[STAGE]) || [];
  const stageConfigured = Array.isArray(showList) && showList.length > 0;
  const showName = SHOW_NAMES[STAGE] || 'Grand Final';
  // Temporarily point the resolver at the selected stage so it returns this
  // contest's acts (instead of the file-level default).
  const _origDataShow = DATA.show;
  DATA.show = STAGE;
  const acts = stageConfigured && typeof window.eurovisionResolveActs === 'function'
    ? window.eurovisionResolveActs()
    : [];
  DATA.show = _origDataShow;
  const actOrder = {};
  acts.forEach((a, i) => { actOrder[a.code] = i + 1; });
  const _showEl = document.getElementById('showName');
  if (_showEl) _showEl.textContent = showName;

  const KEY_PARTY = 'ev_' + PARTY_YEAR + '_party';

  const SCORE_FIELDS = ['vocals', 'performance', 'song', 'original', 'stage'];

  const FIXED_COLS = [
    { key: 'order',   label: '#',   cls: 'num' },
    { key: 'country', label: 'Act', cls: 'act-cell' },
  ];
  const BASE_SORT_KEYS = {
    order:     { type: 'order',  label: 'Performance #' },
    country:   { type: 'string', label: 'Country' },
    performer: { type: 'string', label: 'Performer' },
    song:      { type: 'string', label: 'Song' },
    avg:       { type: 'num',    label: 'Avg Total' },
  };

  let partyUsers = {};
  let userCols = [];
  let sort = { key: 'avg', dir: 'desc' };
  let activeBreakdownCode = null;
  let persistedFunniest = null;

  const $ = id => document.getElementById(id);

  const partyCode = (
    new URLSearchParams(window.location.search).get('party') ||
    localStorage.getItem(KEY_PARTY) ||
    ''
  ).toUpperCase().slice(0, 8);

  const subtitle = $('partySubtitle');
  const partyCodeValue = $('partyCodeValue');

  if (!partyCode) {
    subtitle.textContent = 'No party selected — open this page from the party bar on the main page.';
    return;
  }

  partyCodeValue.textContent = partyCode;
  subtitle.textContent = '';

  if (!stageConfigured) {
    document.querySelectorAll('.table-card').forEach(el => { el.style.display = 'none'; });
    const pwHost = document.querySelector('.party-winner-host');
    if (pwHost) pwHost.style.display = 'none';
    const stageEmpty = $('stageEmpty');
    if (stageEmpty) stageEmpty.style.display = '';
    return;
  }

  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  db.ref(PARTY_YEAR + '/parties/' + partyCode + '/users').on('value', snap => {
    partyUsers = snap.val() || {};
    rebuildUserCols();
    buildSortControls();
    buildTableHead();
    renderTable();
    renderPartyWinner();
    renderFunniest();
    if (activeBreakdownCode) showBreakdown(activeBreakdownCode);
  }, err => {
    console.warn('Firebase read failed:', err);
    subtitle.textContent = 'read failed (' + err.code + ')';
  });

  db.ref(PARTY_YEAR + '/parties/' + partyCode + '/funniest/' + STAGE).on('value', snap => {
    persistedFunniest = snap.val();
    renderFunniest();
  }, err => {
    console.warn('Funniest read failed:', err);
  });

  computePartyWinnerWidth();
  let _resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(_resizeT);
    _resizeT = setTimeout(computePartyWinnerWidth, 150);
  });

  function rebuildUserCols() {
    userCols = Object.entries(partyUsers).map(([uid, data]) => {
      const name = ((data && data.name) || 'Guest').trim();
      return {
        uid,
        name,
        votes: extractStageVotes(data && data.votes),
      };
    });
    userCols.sort((a, b) => a.name.localeCompare(b.name) || a.uid.localeCompare(b.uid));
  }

  // Read votes for the active stage. Falls back to flat (pre-stage) votes
  // as semi-1 for back-compat with users whose data hasn't migrated yet.
  function extractStageVotes(votesNode) {
    if (!votesNode || typeof votesNode !== 'object') return {};
    if (votesNode[STAGE] && typeof votesNode[STAGE] === 'object') return votesNode[STAGE];
    if (STAGE === 'semi-1') {
      const flat = {};
      Object.entries(votesNode).forEach(([k, v]) => {
        if (v && typeof v === 'object' && typeof v.vocals === 'number') flat[k] = v;
      });
      return flat;
    }
    return {};
  }

  function actAvg(code) {
    const totals = userCols
      .map(u => u.votes[code] ? (u.votes[code].total || 0) : null)
      .filter(t => t !== null);
    return totals.length ? totals.reduce((a, b) => a + b, 0) / totals.length : null;
  }

  function buildTableHead() {
    const tr = $('tableHead');
    tr.replaceChildren();

    FIXED_COLS.forEach(col => {
      const th = document.createElement('th');
      th.className = col.cls;
      th.dataset.key = col.key;
      th.textContent = col.label;
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      th.appendChild(arrow);
      th.addEventListener('click', () => onSortClick(col.key));
      tr.appendChild(th);
    });

    const thAvg = document.createElement('th');
    thAvg.className = 'num total';
    thAvg.dataset.key = 'avg';
    thAvg.textContent = 'Avg';
    const arrowAvg = document.createElement('span');
    arrowAvg.className = 'arrow';
    thAvg.appendChild(arrowAvg);
    thAvg.addEventListener('click', () => onSortClick('avg'));
    tr.appendChild(thAvg);
  }

  function buildSortControls() {
    const oldSel = $('sortKey');
    const sel = oldSel.cloneNode(false);
    oldSel.parentNode.replaceChild(sel, oldSel);
    sel.id = 'sortKey';

    Object.keys(BASE_SORT_KEYS).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = BASE_SORT_KEYS[key].label;
      sel.appendChild(opt);
    });

    if (!BASE_SORT_KEYS[sort.key]) sort.key = 'avg';
    sel.value = sort.key;

    sel.onchange = () => { sort.key = sel.value; renderTable(); };
    $('sortDir').onclick = () => {
      sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
      $('sortDir').textContent = sort.dir === 'asc' ? '↑' : '↓';
      renderTable();
    };
    $('sortDir').textContent = sort.dir === 'asc' ? '↑' : '↓';
  }

  function onSortClick(key) {
    if (sort.key === key) {
      sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      sort.key = key;
      sort.dir = (key === 'country' || key === 'performer' || key === 'song' || key === 'order') ? 'asc' : 'desc';
    }
    renderTable();
  }

  function rowFor(act) {
    return {
      code: act.code,
      flag: act.flag,
      country: act.country,
      performer: act.performer,
      song: act.song,
      order: actOrder[act.code],
      avg: actAvg(act.code),
    };
  }

  function compareCells(a, b, key, dir) {
    let av = a[key], bv = b[key];

    if (key === 'order') {
      const an = parseInt(av, 10), bn = parseInt(bv, 10);
      const aHas = Number.isFinite(an), bHas = Number.isFinite(bn);
      if (aHas && bHas) return dir === 'asc' ? an - bn : bn - an;
      if (aHas) return -1;
      if (bHas) return 1;
      return 0;
    }
    if (key === 'country' || key === 'performer' || key === 'song') {
      av = (av || '').toLowerCase();
      bv = (bv || '').toLowerCase();
      return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    const aMissing = typeof av !== 'number';
    const bMissing = typeof bv !== 'number';
    if (aMissing && bMissing) return 0;
    if (aMissing) return 1;
    if (bMissing) return -1;
    return dir === 'asc' ? av - bv : bv - av;
  }

  function renderTable() {
    const totalCols = FIXED_COLS.length + 1;

    const ratedActs = acts.filter(act => userCols.some(u => u.votes[act.code]));
    const rows = ratedActs.map(rowFor);
    rows.sort((a, b) => compareCells(a, b, sort.key, sort.dir));

    const tbody = $('tableBody');
    tbody.replaceChildren();

    if (rows.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = totalCols;
      td.className = 'empty-row';
      td.textContent = 'No votes yet in this party.';
      tr.appendChild(td);
      tbody.appendChild(tr);
    } else {
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = 'body-row';
        tr.dataset.code = r.code;
        if (activeBreakdownCode === r.code) tr.classList.add('editing');
        tr.addEventListener('click', () => showBreakdown(r.code));

        FIXED_COLS.forEach(col => {
          const td = document.createElement('td');
          td.className = col.cls;
          td.dataset.key = col.key;
          if (col.key === 'country') {
            const country = document.createElement('div');
            country.className = 'c-country';
            country.textContent = r.flag + ' ' + r.country;
            const actLine = document.createElement('div');
            actLine.className = 'c-act-line';
            const performer = document.createElement('span');
            performer.className = 'c-performer';
            performer.textContent = r.performer;
            const songSpan = document.createElement('span');
            songSpan.className = 'c-song';
            songSpan.textContent = '“' + r.song + '”';
            actLine.appendChild(performer);
            actLine.appendChild(document.createTextNode(' · '));
            actLine.appendChild(songSpan);
            td.appendChild(country);
            td.appendChild(actLine);
          } else {
            td.textContent = Number.isFinite(r.order) ? String(r.order) : '—';
          }
          tr.appendChild(td);
        });

        const tdAvg = document.createElement('td');
        tdAvg.className = 'num total';
        tdAvg.dataset.key = 'avg';
        tdAvg.textContent = r.avg !== null ? r.avg.toFixed(1) : '—';
        tr.appendChild(tdAvg);

        tbody.appendChild(tr);
      });
    }

    $('tableHead').querySelectorAll('th').forEach(th => {
      const arrow = th.querySelector('.arrow');
      if (th.dataset.key === sort.key) {
        th.classList.add('sorted');
        if (arrow) arrow.textContent = sort.dir === 'asc' ? '▲' : '▼';
      } else {
        th.classList.remove('sorted');
        if (arrow) arrow.textContent = '';
      }
    });

    const sortKeySel = $('sortKey');
    if (sortKeySel) sortKeySel.value = sort.key;
    $('sortDir').textContent = sort.dir === 'asc' ? '↑' : '↓';

    $('ratingsCount').textContent = rows.length + (rows.length === 1 ? ' rating' : ' ratings');
  }

  function renderPartyWinner() {
    const host = $('partyWinner');
    host.replaceChildren();

    const rated = acts
      .map(a => ({ act: a, avg: actAvg(a.code) }))
      .filter(x => x.avg !== null);

    if (rated.length === 0) {
      host.appendChild(buildWinnerEntry(null, true));
      return;
    }

    const maxAvg = rated.reduce((m, x) => x.avg > m ? x.avg : m, -Infinity);
    const maxRounded = maxAvg.toFixed(1);
    const winners = rated.filter(x => x.avg.toFixed(1) === maxRounded);

    winners.forEach((w, idx) => {
      host.appendChild(buildWinnerEntry(w, idx === 0));
    });
  }

  function buildWinnerEntry(winner, withLabel) {
    const entry = document.createElement('div');
    entry.className = 'pw-entry';

    const line1 = document.createElement('div');
    line1.className = 'tp-line tp-line-1';
    if (withLabel) {
      const label = document.createElement('span');
      label.className = 'stat-label';
      label.textContent = 'Party Winner';
      line1.appendChild(label);
    }
    const mid = document.createElement('span');
    mid.className = 'tp-mid';
    const flag = document.createElement('span');
    flag.className = 'tp-flag';
    flag.textContent = winner ? winner.act.flag : '';
    mid.appendChild(flag);
    const country = document.createElement('span');
    country.className = 'tp-country';
    country.textContent = winner ? winner.act.country : '';
    mid.appendChild(country);
    line1.appendChild(mid);
    const points = document.createElement('span');
    points.className = 'tp-points';
    points.textContent = winner ? winner.avg.toFixed(1) + ' pts' : '—';
    line1.appendChild(points);
    entry.appendChild(line1);

    const line2 = document.createElement('div');
    line2.className = 'tp-line tp-line-2';
    const performer = document.createElement('span');
    performer.className = 'tp-performer';
    performer.textContent = winner ? winner.act.performer : '';
    line2.appendChild(performer);
    entry.appendChild(line2);

    const line3 = document.createElement('div');
    line3.className = 'tp-line tp-line-3';
    const song = document.createElement('span');
    song.className = 'tp-song';
    song.textContent = winner ? '“' + winner.act.song + '”' : '';
    line3.appendChild(song);
    entry.appendChild(line3);

    return entry;
  }

  const Humor = window.EurovisionHumor || { scoreComment: () => 0, DISPLAY_THRESHOLD: 4 };
  const scoreComment = Humor.scoreComment;
  const DISPLAY_THRESHOLD = Humor.DISPLAY_THRESHOLD;

  function findFunniest() {
    let best = null;
    userCols.forEach(uc => {
      Object.entries(uc.votes).forEach(([actCode, v]) => {
        const remind = v && typeof v.remind === 'string' ? v.remind.trim() : '';
        if (!remind) return;
        const score = scoreComment(remind);
        if (score < DISPLAY_THRESHOLD) return;
        const act = acts.find(a => a.code === actCode);
        if (!act) return;
        if (
          !best ||
          score > best.score ||
          (score === best.score && remind.length > best.comment.length) ||
          (score === best.score && remind.length === best.comment.length && uc.name.localeCompare(best.voter) < 0)
        ) {
          best = { voter: uc.name, act, comment: remind, score };
        }
      });
    });
    return best;
  }

  // Resolves persisted funniest node into render-shape, validating that the
  // referenced comment still matches the user's current vote. Returns null if
  // stale (user edited/cleared the comment) or referenced data missing.
  function resolvePersisted() {
    if (!persistedFunniest || typeof persistedFunniest !== 'object') return null;
    const { userId, actCode, comment, score } = persistedFunniest;
    if (!userId || !actCode || typeof comment !== 'string') return null;
    const user = partyUsers[userId];
    if (!user) return null;
    const userVotes = extractStageVotes(user.votes);
    const vote = userVotes[actCode];
    const currentRemind = vote && typeof vote.remind === 'string' ? vote.remind.trim() : '';
    if (currentRemind !== comment.trim()) return null;
    const act = acts.find(a => a.code === actCode);
    if (!act) return null;
    const voter = ((user.name) || 'Guest').trim();
    return { voter, act, comment: comment.trim(), score: typeof score === 'number' ? score : 0 };
  }

  function renderFunniest() {
    const host = $('funniestComment');
    const wrapper = $('funniestHost');
    if (!host || !wrapper) return;
    const best = resolvePersisted() || findFunniest();
    if (!best) {
      wrapper.style.display = 'none';
      host.replaceChildren();
      return;
    }
    wrapper.style.display = '';
    host.replaceChildren();

    const entry = document.createElement('div');
    entry.className = 'fc-entry';

    const labelLine = document.createElement('div');
    labelLine.className = 'fc-line fc-line-label';
    const label = document.createElement('span');
    label.className = 'stat-label fc-label';
    label.textContent = 'Funniest Comment';
    labelLine.appendChild(label);
    entry.appendChild(labelLine);

    const quoteLine = document.createElement('div');
    quoteLine.className = 'fc-line fc-quote';
    quoteLine.textContent = '“' + best.comment + '”';
    entry.appendChild(quoteLine);

    const actLine = document.createElement('div');
    actLine.className = 'fc-line fc-act-line';
    const flag = document.createElement('span');
    flag.className = 'fc-flag';
    flag.textContent = best.act.flag;
    const country = document.createElement('span');
    country.className = 'fc-country';
    country.textContent = best.act.country;
    const performer = document.createElement('span');
    performer.className = 'fc-performer';
    performer.textContent = best.act.performer;
    const song = document.createElement('span');
    song.className = 'fc-song';
    song.textContent = '“' + best.act.song + '”';
    actLine.appendChild(flag);
    actLine.appendChild(document.createTextNode(' '));
    actLine.appendChild(country);
    actLine.appendChild(document.createTextNode(' · '));
    actLine.appendChild(performer);
    actLine.appendChild(document.createTextNode(' · '));
    actLine.appendChild(song);
    entry.appendChild(actLine);

    const voterLine = document.createElement('div');
    voterLine.className = 'fc-line fc-voter';
    voterLine.textContent = '— ' + best.voter;
    entry.appendChild(voterLine);

    host.appendChild(entry);
  }

  // Sets --top-pick-width to the widest line-1 (label + flag + country + points)
  // across all acts so the Party Winner container matches the Top Pick
  // container on index.html exactly.
  function computePartyWinnerWidth() {
    if (!acts.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'party-winner-host';
    wrap.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;';
    const statsBox = document.createElement('div');
    statsBox.className = 'stats';
    const stat = document.createElement('div');
    stat.className = 'stat stat-top';
    stat.style.width = 'auto';
    const inner = document.createElement('div');
    inner.className = 'stat-value small';
    inner.style.width = 'auto';
    const entry = document.createElement('div');
    entry.className = 'pw-entry';
    const line1 = document.createElement('div');
    line1.className = 'tp-line tp-line-1';
    line1.style.whiteSpace = 'nowrap';
    const labelSpan = document.createElement('span');
    labelSpan.className = 'stat-label';
    labelSpan.textContent = 'Party Winner';
    const mid = document.createElement('span');
    mid.className = 'tp-mid';
    const flag = document.createElement('span');
    flag.className = 'tp-flag';
    const country = document.createElement('span');
    country.className = 'tp-country';
    mid.appendChild(flag);
    mid.appendChild(country);
    const points = document.createElement('span');
    points.className = 'tp-points';
    points.textContent = '25.0 pts';
    line1.appendChild(labelSpan);
    line1.appendChild(mid);
    line1.appendChild(points);
    entry.appendChild(line1);
    inner.appendChild(entry);
    stat.appendChild(inner);
    statsBox.appendChild(stat);
    wrap.appendChild(statsBox);
    document.body.appendChild(wrap);

    let max = 0;
    acts.forEach(act => {
      flag.textContent = act.flag;
      country.textContent = act.country;
      const w = stat.offsetWidth;
      if (w > max) max = w;
    });
    document.body.removeChild(wrap);

    if (max > 0) document.documentElement.style.setProperty('--top-pick-width', max + 'px');
  }

  function showBreakdown(code) {
    const act = acts.find(a => a.code === code);
    if (!act) return;
    activeBreakdownCode = code;

    const title = $('breakdownTitle');
    title.replaceChildren();
    const line1 = document.createElement('div');
    line1.className = 'bd-title-main';
    line1.textContent = act.flag + ' ' + act.country + ' — ' + act.performer;
    const line2 = document.createElement('div');
    line2.className = 'bd-title-song';
    line2.textContent = '“' + act.song + '”';
    title.appendChild(line1);
    title.appendChild(line2);

    const head = $('breakdownHead');
    head.replaceChildren();
    const thName = document.createElement('th');
    thName.className = 'act-cell';
    thName.textContent = 'Voter';
    head.appendChild(thName);
    const thTotal = document.createElement('th');
    thTotal.className = 'num total';
    thTotal.textContent = 'Total';
    head.appendChild(thTotal);

    const body = $('breakdownBody');
    body.replaceChildren();

    if (userCols.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 2;
      td.className = 'empty-row';
      td.textContent = 'No party members yet.';
      tr.appendChild(td);
      body.appendChild(tr);
    } else {
      userCols.forEach(uc => {
        const v = uc.votes[code];
        const tr = document.createElement('tr');
        tr.className = 'bd-user-row';
        const nameTd = document.createElement('td');
        nameTd.className = 'act-cell';
        nameTd.textContent = uc.name;
        tr.appendChild(nameTd);
        const totalTd = document.createElement('td');
        totalTd.className = 'num total';
        totalTd.textContent = (v && typeof v.total === 'number') ? String(v.total) : '—';
        tr.appendChild(totalTd);
        body.appendChild(tr);

        const comment = v && typeof v.remind === 'string' ? v.remind.trim() : '';
        if (comment) {
          tr.classList.add('bd-has-comment');
          const ctr = document.createElement('tr');
          ctr.className = 'bd-comment-row';
          const ctd = document.createElement('td');
          ctd.colSpan = 2;
          ctd.className = 'bd-comment';
          ctd.textContent = comment;
          ctr.appendChild(ctd);
          body.appendChild(ctr);
        }
      });
    }

    $('tableBody').querySelectorAll('tr.body-row').forEach(tr => {
      tr.classList.toggle('editing', tr.dataset.code === code);
    });

    const card = $('breakdownCard');
    card.style.display = '';
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
})();
</script>

</body>
</html>
