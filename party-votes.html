<script>
(function () {
  'use strict';

  const cfg = JSON.parse(document.getElementById('party-config').textContent);
  const PARTY_YEAR = cfg.year || '2026';
  const FIREBASE_CONFIG = cfg.firebaseConfig;
  const acts = JSON.parse(document.getElementById('acts-data').textContent);

  const KEY_PARTY = 'ev_' + PARTY_YEAR + '_party';

  const FIXED_COLS = [
    { key: 'order',   label: '#',   cls: 'num' },
    { key: 'country', label: 'Act', cls: 'act-cell' },
  ];
  const BASE_SORT_KEYS = {
    order:     { type: 'order',  label: 'Performance #' },
    country:   { type: 'string', label: 'Country' },
    performer: { type: 'string', label: 'Performer' },
    song:      { type: 'string', label: 'Song' },
    avg:       { type: 'num',    label: 'Avg Total' },
  };

  let partyUsers = {};
  let userCols = [];
  let sort = { key: 'avg', dir: 'desc' };

  const $ = id => document.getElementById(id);

  const partyCode = (
    new URLSearchParams(window.location.search).get('party') ||
    localStorage.getItem(KEY_PARTY) ||
    ''
  ).toUpperCase().slice(0, 8);

  const subtitle = $('partySubtitle');

  if (!partyCode) {
    subtitle.textContent = 'No party selected — open this page from the party bar on the main page.';
    return;
  }

  subtitle.textContent = 'Party ' + partyCode;

  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  db.ref(PARTY_YEAR + '/parties/' + partyCode + '/users').on('value', snap => {
    partyUsers = snap.val() || {};
    rebuildUserCols();
    buildSortControls();
    buildTableHead();
    renderTable();
  }, err => {
    console.warn('Firebase read failed:', err);
    subtitle.textContent = 'Party ' + partyCode + ' — read failed (' + err.code + ')';
  });

  function rebuildUserCols() {
    userCols = Object.entries(partyUsers).map(([uid, data]) => {
      const name = ((data && data.name) || 'Guest').trim();
      return {
        uid,
        label: name.slice(0, 2) || '??',
        name,
        votes: (data && data.votes) || {},
      };
    });
    userCols.sort((a, b) => a.label.localeCompare(b.label) || a.uid.localeCompare(b.uid));
  }

  function actAvg(code) {
    const totals = userCols
      .map(u => u.votes[code] ? (u.votes[code].total || 0) : null)
      .filter(t => t !== null);
    return totals.length ? totals.reduce((a, b) => a + b, 0) / totals.length : null;
  }

  function buildTableHead() {
    const tr = $('tableHead');
    tr.replaceChildren();

    FIXED_COLS.forEach(col => {
      const th = document.createElement('th');
      th.className = col.cls;
      th.dataset.key = col.key;
      th.textContent = col.label;
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      th.appendChild(arrow);
      th.addEventListener('click', () => onSortClick(col.key));
      tr.appendChild(th);
    });

    userCols.forEach(uc => {
      const th = document.createElement('th');
      th.className = 'num';
      th.dataset.key = 'user_' + uc.uid;
      th.textContent = uc.label;
      th.title = uc.name;
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      th.appendChild(arrow);
      th.addEventListener('click', () => onSortClick('user_' + uc.uid));
      tr.appendChild(th);
    });

    const thAvg = document.createElement('th');
    thAvg.className = 'num total';
    thAvg.dataset.key = 'avg';
    thAvg.textContent = 'Avg';
    const arrowAvg = document.createElement('span');
    arrowAvg.className = 'arrow';
    thAvg.appendChild(arrowAvg);
    thAvg.addEventListener('click', () => onSortClick('avg'));
    tr.appendChild(thAvg);
  }

  function buildSortControls() {
    const oldSel = $('sortKey');
    const sel = oldSel.cloneNode(false);
    oldSel.parentNode.replaceChild(sel, oldSel);
    sel.id = 'sortKey';

    const allKeys = Object.assign({}, BASE_SORT_KEYS);
    userCols.forEach(uc => {
      allKeys['user_' + uc.uid] = { type: 'num', label: uc.label };
    });

    Object.keys(allKeys).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = allKeys[key].label;
      sel.appendChild(opt);
    });

    if (!allKeys[sort.key]) sort.key = 'avg';
    sel.value = sort.key;

    sel.onchange = () => { sort.key = sel.value; renderTable(); };
    $('sortDir').onclick = () => {
      sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
      $('sortDir').textContent = sort.dir === 'asc' ? '↑' : '↓';
      renderTable();
    };
    $('sortDir').textContent = sort.dir === 'asc' ? '↑' : '↓';
  }

  function onSortClick(key) {
    if (sort.key === key) {
      sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      sort.key = key;
      sort.dir = (key === 'country' || key === 'performer' || key === 'song' || key === 'order') ? 'asc' : 'desc';
    }
    renderTable();
  }

  function rowFor(act) {
    const row = {
      code: act.code,
      flag: act.flag,
      country: act.country,
      performer: act.performer,
      song: act.song,
      order: act.order,
      avg: actAvg(act.code),
    };
    userCols.forEach(uc => {
      const v = uc.votes[act.code];
      row['user_' + uc.uid] = v && v.total != null ? v.total : null;
    });
    return row;
  }

  function compareCells(a, b, key, dir) {
    let av = a[key], bv = b[key];

    if (key === 'order') {
      const an = parseInt(av, 10), bn = parseInt(bv, 10);
      const aHas = Number.isFinite(an), bHas = Number.isFinite(bn);
      if (aHas && bHas) return dir === 'asc' ? an - bn : bn - an;
      if (aHas) return -1;
      if (bHas) return 1;
      return 0;
    }
    if (key === 'country' || key === 'performer' || key === 'song') {
      av = (av || '').toLowerCase();
      bv = (bv || '').toLowerCase();
      return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    const aMissing = typeof av !== 'number';
    const bMissing = typeof bv !== 'number';
    if (aMissing && bMissing) return 0;
    if (aMissing) return 1;
    if (bMissing) return -1;
    return dir === 'asc' ? av - bv : bv - av;
  }

  function renderTable() {
    const totalCols = FIXED_COLS.length + userCols.length + 1;

    const ratedActs = acts.filter(act => userCols.some(u => u.votes[act.code]));
    const rows = ratedActs.map(rowFor);
    rows.sort((a, b) => compareCells(a, b, sort.key, sort.dir));

    const tbody = $('tableBody');
    tbody.replaceChildren();

    if (rows.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = totalCols;
      td.className = 'empty-row';
      td.textContent = 'No votes yet in this party.';
      tr.appendChild(td);
      tbody.appendChild(tr);
    } else {
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = 'body-row';
        tr.dataset.code = r.code;

        FIXED_COLS.forEach(col => {
          const td = document.createElement('td');
          td.className = col.cls;
          td.dataset.key = col.key;
          if (col.key === 'country') {
            const country = document.createElement('div');
            country.className = 'c-country';
            country.textContent = r.flag + ' ' + r.country;
            const actLine = document.createElement('div');
            actLine.className = 'c-act-line';
            const performer = document.createElement('span');
            performer.className = 'c-performer';
            performer.textContent = r.performer;
            const songSpan = document.createElement('span');
            songSpan.className = 'c-song';
            songSpan.textContent = '“' + r.song + '”';
            actLine.appendChild(performer);
            actLine.appendChild(document.createTextNode(' · '));
            actLine.appendChild(songSpan);
            td.appendChild(country);
            td.appendChild(actLine);
          } else {
            td.textContent = (r.order === '' || r.order == null) ? '—' : String(r.order);
          }
          tr.appendChild(td);
        });

        userCols.forEach(uc => {
          const td = document.createElement('td');
          td.className = 'num';
          td.dataset.key = 'user_' + uc.uid;
          const val = r['user_' + uc.uid];
          td.textContent = val !== null && val !== undefined ? String(val) : '—';
          tr.appendChild(td);
        });

        const tdAvg = document.createElement('td');
        tdAvg.className = 'num total';
        tdAvg.dataset.key = 'avg';
        tdAvg.textContent = r.avg !== null ? r.avg.toFixed(1) : '—';
        tr.appendChild(tdAvg);

        tbody.appendChild(tr);
      });
    }

    $('tableHead').querySelectorAll('th').forEach(th => {
      const arrow = th.querySelector('.arrow');
      if (th.dataset.key === sort.key) {
        th.classList.add('sorted');
        if (arrow) arrow.textContent = sort.dir === 'asc' ? '▲' : '▼';
      } else {
        th.classList.remove('sorted');
        if (arrow) arrow.textContent = '';
      }
    });

    const sortKeySel = $('sortKey');
    if (sortKeySel) sortKeySel.value = sort.key;
    $('sortDir').textContent = sort.dir === 'asc' ? '↑' : '↓';

    $('ratingsCount').textContent = rows.length + (rows.length === 1 ? ' rating' : ' ratings');
  }
})();
</script>
